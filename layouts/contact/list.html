{{ define "main" }}
{{/* Surcharge projet de themes/educenter-hugo/layouts/contact/list.html
     (le thème est un sous-module git : toute correction doit vivre ici).

     Corrections d'accessibilité, sans effet sur la mise en page :
     · RGAA 11.1  — les quatre champs du formulaire n'avaient ni <label>, ni
       aria-label, ni aria-labelledby : seul un `placeholder` en anglais tenait
       lieu d'étiquette, ce que le RGAA n'accepte pas. Chaque champ reçoit une
       vraie étiquette <label for="…">, en français.
       ⚠ Ces étiquettes sont posées en `.sr-only` pour ne pas modifier le rendu.
         Le RGAA privilégie l'étiquette VISIBLE (meilleure pour les troubles
         cognitifs) : retirer `class="sr-only"` suffit à passer à cette variante.
     · RGAA 11.13 (WCAG 1.3.5) — autocomplete="name" / "email" sur les champs
       correspondant à des données personnelles de l'utilisateur.
     · RGAA 12.6  — le <form> devient un landmark nommé (aria-label).
     · RGAA 6.1   — `mobile` et `email` valent "#" dans hugo.toml : le thème
       produisait <a href="tel:#">#</a> et <a href="mailto:#">#</a>, liens non
       explicites vers nulle part. Leur affichage est conditionné à une valeur réelle.
     · RGAA 8.2 / 9.1 — `address = "#"` passé à markdownify produisait
       <p><h1></h1></p> : HTML invalide ET un <h1> vide en double du <h1> de page.
       Affichage conditionné, et rendu en markdown « inline » pour ne plus
       imbriquer de bloc dans le <p>.
     · La carte Google : `params.map.enable` vaut false, mais le thème émettait
       quand même <div id="map_canvas"> (500 px de haut, vide). La section est
       désormais conditionnée à `map.enable`. */}}

<!-- contact -->
<section class="section bg-gray">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <h2 class="section-title">{{ i18n "contact_us" }}</h2>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-7 mb-4 mb-lg-0">
        <form action="{{ site.Params.contact_form_action | safeURL }}" method="POST" aria-label="{{ i18n "contact_form" }}">
          <label class="sr-only" for="name">Nom et prénom</label>
          <input type="text" class="form-control mb-3" id="name" name="name" autocomplete="name" placeholder="Votre nom et prénom">
          <label class="sr-only" for="mail">Adresse électronique</label>
          <input type="email" class="form-control mb-3" id="mail" name="mail" autocomplete="email" placeholder="Votre adresse électronique">
          <label class="sr-only" for="subject">Objet du message</label>
          <input type="text" class="form-control mb-3" id="subject" name="subject" placeholder="Objet du message">
          <label class="sr-only" for="message">Message</label>
          <textarea name="message" id="message" class="form-control mb-3" placeholder="Votre message"></textarea>
          <button type="submit" value="send" class="btn btn-primary">{{ i18n "send" }}</button>
        </form>
      </div>
      <div class="col-lg-5 content">
        {{ .Content }}
        {{ with site.Params.mobile }}{{ if ne . "#" }}
        <a href="tel:{{ . }}" class="text-color h5 d-block"><span class="sr-only">Téléphone : </span>{{ . }}</a>
        {{ end }}{{ end }}
        {{ with site.Params.email }}{{ if ne . "#" }}
        <a href="mailto:{{ . }}" class="mb-5 text-color h5 d-block"><span class="sr-only">Courriel : </span>{{ . }}</a>
        {{ end }}{{ end }}
        {{ with site.Params.address }}{{ if ne . "#" }}
        <p>{{ $.RenderString (dict "display" "inline") . }}</p>
        {{ end }}{{ end }}
      </div>
    </div>
  </div>
</section>
<!-- /contact -->

{{ if site.Params.map.enable }}
<!-- gmap -->
<section class="section pt-0">
  <!-- Google Map -->
  <div id="map_canvas"
  data-latitude="{{ site.Params.map.map_latitude }}"
  data-longitude="{{ site.Params.map.map_longitude }}"
  data-marker="{{ site.Params.map.map_marker | absURL }}"
  data-marker-name="{{ site.Title }}"></div>
</section>
<!-- /gmap -->
{{ end }}

{{ end }}
