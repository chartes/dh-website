# ⚠ Ce domaine est celui réellement servi. Il n'affecte pas les liens internes
# (`relativeURLs = true` les rend tous relatifs, le site continue donc de
# fonctionner sous n'importe quel préfixe), mais il conditionne les URL
# ABSOLUES exigées par les robots des réseaux sociaux : `og:image`, `og:url`
# et `rel="canonical"` (cf. layouts/partials/head.html).
baseURL = "https://hn.chartes.psl.eu/"
canonifyURLs = true
relativeURLs = true
locale = "fr-fr"
defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false
title = "Digital humanities @ Chartes"
theme = "educenter-hugo"
disableLanguages = ["en"]

############################# Permalinks ##############################
# Les types de contenu du thème (teacher, event, projects) sont exposés
# sous des URLs francisées (équipe / conférences / projets).
[permalinks]
teacher = "/equipe/:slug/"
event = "/conferences/:slug/"
projects = "/projets/:slug/"


#################### default parameters ################################
[params]
logo = "images/logo-enc-psl-blanc.png"
# Meta data
description = "Le site web du master DH de l'École nationale des chartes"
author = "École nationale des chartes-PSL" #
# Aperçu par défaut lors du partage sur les réseaux sociaux (og:image).
# Surchargeable page par page avec `og_image` / `og_image_alt` dans le
# frontmatter, ou à défaut par le champ `image` du billet.
# Format attendu par les grandes cartes : 1200 × 630 (ratio 1,91:1).
# Origine absolue du site, pour les seules URL que les robots des réseaux
# sociaux exigent absolues : og:url, og:image et rel="canonical".
# ⚠ Doit rester identique à `baseURL` ci-dessus. Cette duplication est
# imposée par `relativeURLs = true` : sous cette option, `.Permalink`,
# `absURL` et `site.BaseURL` renvoient tous du relatif, et il n'existe aucun
# moyen de relire la valeur brute de `baseURL` depuis un gabarit.
# (L'alternative serait `relativeURLs = false`, qui rendrait absolus les
# liens internes des 142 pages — le site ne serait alors plus servable sous
# un autre préfixe que celui-ci.)
site_url = "https://hn.chartes.psl.eu"
og_image = "images/og/default.jpg"
og_image_alt = "Bannière du master Humanités numériques de l'École nationale des chartes – PSL"
# contact info
address = "#"
mobile = "#"
email = "#"
# contact form action
contact_form_action = "#" # contact form works with https://formspree.io
# Plateformes open source
github_url = "https://github.com/chartes"
huggingface_url = "https://huggingface.co/ENC-PSL"
apps_url = "https://dh.chartes.psl.eu"
# Google Analitycs
google_analitycs_id = ""
# top header
top_header = false

# Accessibilité — mention obligatoire affichée en pied de page sur toutes les pages
# (décret n° 2019-768 du 24 juillet 2019). Valeurs admises, et elles seules :
#   "totalement conforme"   — 100 % des critères RGAA applicables respectés
#   "partiellement conforme" — au moins 50 %
#   "non conforme"          — moins de 50 %, ou aucun audit en cours de validité
# À mettre à jour en même temps que content/french/accessibilite/_index.md.
[params.accessibility]
level = "totalement conforme"
audit_date = "2026-08-17"
contact = "communication@chartes.psl.eu"

buildFuture = true

############################# Build ##############################
[build]
noJSConfigInAssets = false
useResourceCacheWhen = 'fallback'
[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/.*\.(js|ts|jsx|tsx)'
target = '(js|scripts|javascript)'
[[build.cachebusters]]
source = 'assets/.*\.(css|sass|scss)$'
target = '(css|styles|scss|sass)'
[[build.cachebusters]]
source = 'assets/.*\.(.*)$'
target = '$1'


############################# Outputs ##############################
[outputs]
home = ["HTML", "RSS"]

############################# Imaging ##############################
[imaging]
# See https://github.com/disintegration/imaging
# Default JPEG or WebP quality setting. Default is 75.
quality = 90
resampleFilter = "lanczos"

############################# Caches ###############################
[caches]
[caches.images]
dir = ":resourceDir/_gen"
maxAge = "720h"

[caches.assets]
dir = ":resourceDir/_gen"
maxAge = "720h"

############################# Markup ###############################
[markup]
[markup.goldmark.renderer]
unsafe = true

############################# Plugins ##############################

# CSS Plugins
[[params.plugins.css]]
link = "plugins/bootstrap/bootstrap.min.css"
[[params.plugins.css]]
link = "plugins/slick/slick.css"
[[params.plugins.css]]
link = "plugins/animate/animate.css"
[[params.plugins.css]]
link = "plugins/venobox/venobox.css"
[[params.plugins.css]]
link = "plugins/themify-icons/themify-icons.css"

# JS Plugins
[[params.plugins.js]]
link = "plugins/jQuery/jquery.min.js"
[[params.plugins.js]]
link = "plugins/bootstrap/bootstrap.min.js"
[[params.plugins.js]]
link = "plugins/slick/slick.min.js"
[[params.plugins.js]]
link = "plugins/venobox/venobox.min.js"
[[params.plugins.js]]
link = "plugins/filterizr/jquery.filterizr.min.js"
[[params.plugins.js]]
link = "plugins/google-map/gmap.js"


# Preloader
[params.preloader]
enable = false
preloader = "images/preloader.gif" # use jpg, png, svg or gif format.

# Subscription
[params.subscription]
enable = false
# mailchimp subsciption
mailchimp_form_action = "#" # replace this url with yours
mailchimp_form_name = "#" # replace this code with yours

# google map
[params.map]
enable = false
gmap_api = "#"
map_latitude = "#"
map_longitude = "#"
map_marker = "images/marker.png" # marker size 37*55 px

# cookies
[params.cookies]
enable = false
expire_days = 2
  
