######################## default configuration ####################
baseURL = "/"
title = "Digital humanities @ Chartes"
theme = "educenter-hugo"
# Default time zone for time stamps; use any valid tz database name: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List
timeZone = "America/New_York"
# post pagination
pagination.pagerSize = 6 # see https://gohugo.io/extras/pagination/
# post excerpt
summaryLength = 10 # see https://gohugo.io/content-management/excerpts/
# google analytics
googleAnalytics = "UA-123456-78" # example: UA-123456-78, for more info, read the article https://support.google.com/analytics/answer/1008080?hl=en
# disable language
disableLanguages = [
  "en",
] # example: ["fr"] for disable french language. see https://gohugo.io/content-management/multilingual/
hasCJKLanguage = false #  If hasCJKLanguage true, auto-detect Chinese/Japanese/Korean Languages in the content. see: https://gohugo.io/getting-started/configuration/#hascjklanguage

[services.disqus]
# Désactivé — RGAA 2.1 / 8.7, et accessoirement fuite de données.
#
# Le `shortname` hérité du thème (« themefisher-template ») est celui de l'éditeur
# du thème, pas celui de l'École : les commentaires déposés sur ce site partaient
# donc sur le compte d'un tiers. Le module injectait par ailleurs, sur 15 pages,
# un cadre <iframe> dont l'accessibilité n'est ni évaluable ni sous le contrôle de
# l'École, ainsi que des mentions en anglais (« comments powered by Disqus ») sans
# indication de changement de langue.
#
# Le gabarit (layouts/_default/single.html) conditionne déjà l'affichage à la
# présence de cette valeur : la laisser vide suffit à retirer le module.
# Pour réactiver des commentaires, renseigner ici le shortname de l'École — et
# auditer alors les critères 2.1, 2.2 et 8.7, qui redeviendront applicables.
shortname = ''
