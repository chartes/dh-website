################################# Hero #####################################
hero:
  enable : true
  bg_image : "images/banniere.jpg"
  title : "Humanités numériques"
  subtitle : "École nationale des chartes – PSL"
  content : "Une équipe de recherche et de formation à la croisée des sciences humaines, de l'intelligence artificielle et de la datascience."
  button:
    enable : true
    label : "Découvrir nos projets"
    link : "master/"


############################### Banner feature ###############################
# Section qui chevauche légèrement le hero (margin-top: -100px sur .feature-blocks)
banner_feature:
  enable : true
  image : "images/banner/banner-feature-home.png"
  feature_item:
    - name : "Recherche"
      icon : "ti-book"
      content : "L'équipe est engagée dans plusieurs projets entre transmission de manuscrits, identification de faux, transcription automatiques, computer vision pour les données patrimoniales et LLM pour l'analyse des langues anciennes."

    - name : "Formation"
      icon : "ti-blackboard"
      content : "Master en sciences des données pour les humanités, le master Humanités numériques forme à l'intelligence artificielle appliqué aux sciences humaines."

    - name : "Projets"
      icon : "ti-agenda"
      content : "Édition numérique, traitement automatique des langues anciennes, vision par ordinateur appliquée au patrimoine, transmission des textes."

    - name : "Diffusion"
      icon : "ti-write"
      content : "Conférences, séminaires et publications pour faire dialoguer humanités, informatique et patrimoine."


############################## About ##################################
about:
  enable : true
  title : "L'équipe Humanités numériques"
  image : "images/about/about-us-enc.jpg"
  content : "Au sein de l'École nationale des chartes – PSL, l'équipe Humanités numériques associe enseignants-chercheurs, ingénieurs et étudiants autour de l'apport des méthodes computationnelles aux sciences historiques, philologiques et patrimoniales. Elle développe des projets de recherche, encadre le master Humanités numériques et participe activement à la diffusion scientifique."
  button:
    enable : true
    label : "Rencontrer l'équipe"
    link : "equipe/"


