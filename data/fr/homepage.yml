################################# Hero #####################################
hero:
  enable : true
  bg_image : "images/banniere.jpg"
  title : "Humanités numériques"
  subtitle : "École nationale des chartes – PSL"
  content : "Une équipe de recherche et de formation à la croisée des sciences humaines, de l'informatique et des sciences des données."
  button:
    enable : true
    label : "Découvrir le master"
    link : "master/"


############################### Banner feature ###############################
# Section qui chevauche légèrement le hero (margin-top: -100px sur .feature-blocks)
banner_feature:
  enable : true
  image : "images/banner/banner-feature.png"
  feature_item:
    - name : "Recherche"
      icon : "ti-book"
      content : "Une équipe pluridisciplinaire qui développe des projets à la croisée des sciences humaines et des sciences des données."

    - name : "Formation"
      icon : "ti-blackboard"
      content : "Le master Humanités numériques de l'École nationale des chartes – PSL forme aux méthodes computationnelles."

    - name : "Projets"
      icon : "ti-agenda"
      content : "Édition numérique, traitement automatique des langues anciennes, vision par ordinateur appliquée au patrimoine."

    - name : "Diffusion"
      icon : "ti-write"
      content : "Conférences, séminaires et publications pour faire dialoguer humanités, informatique et patrimoine."


############################## About ##################################
about:
  enable : true
  title : "L'équipe Humanités numériques"
  image : "images/about/about-us.jpg"
  content : "Au sein de l'École nationale des chartes – PSL, l'équipe Humanités numériques associe enseignants-chercheurs, ingénieurs et étudiants autour de l'apport des méthodes computationnelles aux sciences historiques, philologiques et patrimoniales. Elle développe des projets de recherche, encadre le master Humanités numériques et participe activement à la diffusion scientifique."
  button:
    enable : true
    label : "Rencontrer l'équipe"
    link : "equipe/"


